services:
  - type: web
    name: ai-ticket-project
    runtime: python-3.11
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true