{% extends "base.html" %}

{% block title %}Create Account — ResolvAI{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Join ResolvAI 🚀</h1>
            <p>Deploy AI-driven ticket routing and resolution</p>
        </div>

        <form method="POST" class="auth-form" id="registerForm" onsubmit="return validateForm('registerForm')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a unique username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a strong password (minimum 8 characters)" required minlength="8">
            </div>

            <button type="submit" class="auth-button" style="margin-top: 0.5rem;">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
